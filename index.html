<title>Formulário Núcleo RH</title>
<meta name="description" content="Formulário de Recrutamento e Seleção — Núcleo RH">
<meta property="og:title" content="Núcleo RH — Formulário de Recrutamento">
<meta property="og:description" content="Preencha seus dados para o processo seletivo da Núcleo RH.">

<meta property="og:url" content="https://andradeacessos-coder.github.io/nucleo-rh-formulario/">

<style>
:root{
  --navy:#173d63;
  --navy-2:#0f2c47;
  --paper:#ffffff;
  --paper-2:#f3f6f9;
  --ink:#1c2530;
  --ink-soft:#51606f;
  --line:#d7dee6;
  --gold:#b3822f;
  --danger:#b3432f;
  --ok:#2f7a4f;
  --focus:#3f7fc4;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --navy:#25567f;
    --navy-2:#173a5a;
    --paper:#141a22;
    --paper-2:#1b232d;
    --ink:#e7edf3;
    --ink-soft:#a8b6c3;
    --line:#2c3846;
    --gold:#d1a459;
    --danger:#e08069;
    --ok:#6fce93;
    --focus:#6ea8e0;
  }
}
:root[data-theme="dark"]{
  --navy:#25567f;
  --navy-2:#173a5a;
  --paper:#141a22;
  --paper-2:#1b232d;
  --ink:#e7edf3;
  --ink-soft:#a8b6c3;
  --line:#2c3846;
  --gold:#d1a459;
  --danger:#e08069;
  --ok:#6fce93;
  --focus:#6ea8e0;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--paper-2);
  color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,Segoe UI,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:'Poppins',Inter,system-ui,sans-serif; text-wrap:balance; margin:0}
.wrap{max-width:720px;margin:0 auto;padding:0 0 48px}
.topbar{
  background:var(--navy);
  color:#fff;
  padding:18px 20px 20px;
  display:flex;
  align-items:center;
  gap:14px;
  position:sticky;
  top:0;
  z-index:10;
  box-shadow:0 2px 10px rgba(0,0,0,.15);
}
.topbar img{width:40px;height:40px;border-radius:50%;flex:none}
.topbar .brand-text{line-height:1.15}
.topbar .brand-text b{font-family:'Poppins',sans-serif;font-size:17px;letter-spacing:.02em}
.topbar .brand-text span{display:block;font-size:11.5px;opacity:.85}
.progress-track{height:4px;background:rgba(255,255,255,.25);border-radius:2px;margin-top:12px;overflow:hidden}
.progress-fill{height:100%;background:var(--gold);width:0%;transition:width .25s ease}

.hero{padding:22px 20px 4px}
.hero h1{font-size:22px;color:var(--ink)}
.hero p{color:var(--ink-soft);font-size:13.5px;margin:6px 0 0;line-height:1.5}
.meta-row{display:flex;gap:10px;margin:14px 20px 0;flex-wrap:wrap}
.meta-row .field{flex:1;min-width:140px}

section.card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:14px;
  margin:18px 20px 0;
  overflow:hidden;
}
.card-head{
  background:var(--navy-2);
  color:#fff;
  padding:12px 16px;
  font-family:'Poppins',sans-serif;
  font-size:13.5px;
  font-weight:600;
  letter-spacing:.03em;
  text-transform:uppercase;
}
.card-body{padding:16px}
.field{margin-bottom:14px}
.field:last-child{margin-bottom:0}
label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:5px}
label .opt{font-weight:400;color:var(--ink-soft);font-size:12px}
input[type=text],input[type=date],input[type=tel],input[type=email],input[type=number],textarea,select{
  width:100%;
  padding:11px 12px;
  border:1px solid var(--line);
  border-radius:9px;
  background:var(--paper);
  color:var(--ink);
  font-size:15px;
  font-family:inherit;
}
textarea{min-height:70px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--focus);outline-offset:1px;border-color:var(--focus)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:480px){.row3{grid-template-columns:1fr 1fr}}

.choices{display:flex;flex-direction:column;gap:8px}
.choice{
  display:flex;align-items:center;gap:10px;
  border:1px solid var(--line);border-radius:9px;
  padding:10px 12px;cursor:pointer;font-size:14.5px;
}
.choice input{width:17px;height:17px;flex:none;accent-color:var(--navy)}
.choice.checked{border-color:var(--navy);background:var(--paper-2)}
.subfield{margin-top:8px;margin-left:27px}

.grid-table{width:100%;border-collapse:collapse;font-size:13px}
.grid-table th{background:var(--paper-2);color:var(--ink-soft);font-weight:600;padding:8px 6px;text-align:center;border-bottom:1px solid var(--line)}
.grid-table th:first-child{text-align:left}
.grid-table td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line)}
.grid-table td:first-child{text-align:left;font-weight:500}
.grid-table input{width:17px;height:17px;accent-color:var(--navy)}
.grid-wrap{overflow-x:auto}
.scale5{display:flex;justify-content:center;gap:4px}

.note{font-size:12.5px;color:var(--ink-soft);margin-top:4px}
.req{color:var(--danger)}

.lgpd-text{font-size:13px;color:var(--ink-soft);line-height:1.6;background:var(--paper-2);border-radius:9px;padding:12px}

.actions{padding:22px 20px 0}
.btn{
  width:100%;
  padding:15px;
  border:none;
  border-radius:11px;
  background:var(--navy);
  color:#fff;
  font-size:16px;
  font-weight:600;
  font-family:'Poppins',sans-serif;
  cursor:pointer;
}
.btn:active{transform:translateY(1px)}
.btn.secondary{background:transparent;border:1px solid var(--line);color:var(--ink)}
.err-banner{
  margin:14px 20px 0;padding:12px 14px;border-radius:9px;
  background:color-mix(in srgb, var(--danger) 15%, var(--paper));
  color:var(--danger);font-size:13.5px;font-weight:600;display:none;
}

/* success screen */
.success{
  max-width:480px;margin:60px auto;text-align:center;padding:0 24px;
}
.success .check{
  width:64px;height:64px;border-radius:50%;background:var(--ok);
  display:flex;align-items:center;justify-content:center;margin:0 auto 18px;
}
.success h1{font-size:20px}
.success p{color:var(--ink-soft);font-size:14px;margin-top:8px;line-height:1.6}

/* ===== ADMIN ===== */
.admin-wrap{max-width:1100px;margin:0 auto;padding:24px 20px 60px}
.admin-topbar{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.admin-topbar h1{font-size:19px}
.admin-topbar .count{background:var(--navy);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px}
.admin-toolbar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.btn.small{width:auto;padding:10px 16px;font-size:13.5px}
.candidate-list{display:flex;flex-direction:column;gap:10px}
.cand-row{
  display:flex;align-items:center;gap:12px;
  background:var(--paper);border:1px solid var(--line);border-radius:11px;
  padding:12px 14px;
}
.cand-row .idx{font-family:'Poppins',sans-serif;font-weight:700;color:var(--ink-soft);width:26px}
.cand-row .info{flex:1;min-width:0}
.cand-row .info b{display:block;font-size:14.5px}
.cand-row .info span{display:block;font-size:12px;color:var(--ink-soft)}
.gate{max-width:420px;margin:80px auto;text-align:center;padding:0 24px;color:var(--ink-soft);font-size:14px;line-height:1.6}

.login-box{max-width:360px;margin:70px auto;padding:0 24px}
.login-box h1{font-size:19px;text-align:center;margin-bottom:6px}
.login-box p{color:var(--ink-soft);font-size:13px;text-align:center;margin-bottom:20px}
.login-box .field{margin-bottom:12px}

@media print{
  body{background:#fff}
  .no-print{display:none !important}
}
</style>

let state = {};
let allFields = [];
SECOES.forEach(s => s.campos.forEach(c => allFields.push(c)));

function uid(){
  return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
}

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function fieldVisible(campo){
  if(getTier() < (campo.tier||0)) return false;
  if(!campo.showIf) return true;
  const [k,v] = campo.showIf;
  return state[k] === v;
}

function secaoVisible(secao){
  return getTier() >= (secao.tier||0);
}

function renderChoiceGroup(campo, tipo){
  const val = state[campo.k];
  return campo.opcoes.map((op,i) => {
    const checked = tipo === 'radio' ? (val === op) : (Array.isArray(val) && val.includes(op));
    return `<label class="choice ${checked?'checked':''}">
      <input type="${tipo}" name="${campo.k}" value="${esc(op)}" ${checked?'checked':''} onchange="onChoice('${campo.k}','${tipo}', this)">
      <span>${esc(op)}</span>
    </label>`;
  }).join('');
}

function renderGrid(campo){
  const linhas = campo.linhas.concat(campo.comOutro ? ['Outro'] : []);
  const val = state[campo.k] || {};
  let rows = linhas.map(linha => {
    const cells = campo.colunas.map(col => {
      const name = campo.k + '__' + linha;
      const checked = val[linha] === col;
      return `<td><input type="radio" name="${esc(name)}" ${checked?'checked':''} onchange="onGridChoice('${campo.k}','${esc(linha)}','${esc(col)}')"></td>`;
    }).join('');
    const label = linha === 'Outro'
      ? `Outro: <input type="text" style="width:90px;display:inline-block;padding:3px 6px;font-size:12px" value="${esc(state[campo.k+'__outroLabel']||'')}" oninput="state['${campo.k}__outroLabel']=this.value" placeholder="especificar">`
      : esc(linha);
    return `<tr><td>${label}</td>${cells}</tr>`;
  }).join('');
  return `<div class="grid-wrap"><table class="grid-table">
    <thead><tr><th></th>${campo.colunas.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

function renderScale5(campo){
  const val = state[campo.k] || {};
  return `<div class="grid-wrap"><table class="grid-table">
    <thead><tr><th style="text-align:left">Competência</th>${[1,2,3,4,5].map(n=>`<th>${n}</th>`).join('')}</tr></thead>
    <tbody>${campo.linhas.map(linha => {
      const cells = [1,2,3,4,5].map(n => {
        const name = campo.k + '__' + linha;
        const checked = val[linha] === n;
        return `<td><input type="radio" name="${esc(name)}" ${checked?'checked':''} onchange="onGridChoice('${campo.k}','${esc(linha)}',${n})"></td>`;
      }).join('');
      return `<tr><td>${esc(linha)}</td>${cells}</tr>`;
    }).join('')}</tbody>
  </table></div>`;
}

window.onChoice = function(k, tipo, el){
  if(tipo === 'radio'){
    state[k] = el.value;
  } else {
    const campo = allFields.find(c=>c.k===k);
    let arr = Array.isArray(state[k]) ? state[k].slice() : [];
    if(el.checked){
      if(campo.max && arr.length >= campo.max){
        el.checked = false;
        showErr(`Você pode marcar no máximo ${campo.max} opções neste item.`);
        return;
      }
      arr.push(el.value);
    } else {
      arr = arr.filter(v => v !== el.value);
    }
    state[k] = arr;
  }
  renderForm();
};

window.onGridChoice = function(k, linha, valor){
  const obj = Object.assign({}, state[k] || {});
  obj[linha] = valor;
  state[k] = obj;
};

function showErr(msg){
  const box = document.getElementById('err-banner');
  if(!box) return;
  box.textContent = msg;
  box.style.display = 'block';
  box.scrollIntoView({behavior:'smooth', block:'center'});
}

function renderField(campo){
  if(!fieldVisible(campo)) return '';
  const reqMark = campo.req ? ' <span class="req">*</span>' : '';
  let inner = '';
  if(['text','date','tel','email','number'].includes(campo.tipo)){
    inner = `<input type="${campo.tipo}" value="${esc(state[campo.k]||'')}" oninput="state['${campo.k}']=this.value">`;
  } else if(campo.tipo === 'textarea'){
    inner = `<textarea oninput="state['${campo.k}']=this.value">${esc(state[campo.k]||'')}</textarea>`;
  } else if(campo.tipo === 'radio' || campo.tipo === 'checkbox'){
    inner = `<div class="choices">${renderChoiceGroup(campo, campo.tipo)}</div>`;
  } else if(campo.tipo === 'grid'){
    inner = renderGrid(campo);
  } else if(campo.tipo === 'scale5'){
    inner = renderScale5(campo);
  }
  return `<div class="field"><label>${esc(campo.label)}${reqMark}</label>${inner}</div>`;
}

function renderSecao(secao){
  if(!secaoVisible(secao)) return '';
  const camposHtml = secao.campos.map(renderField).join('');
  const lgpdText = secao.lgpd ? `<div class="lgpd-text">Declaro estar ciente e concordo que meus dados pessoais e profissionais fornecidos neste formulário sejam armazenados e utilizados pela NÚCLEO RH para compor o banco de talentos e para fins de recrutamento, seleção e oferecimento de oportunidades profissionais, inclusive vagas sazonais/temporada, nos termos da Lei nº 13.709/2018 (LGPD). Posso solicitar, a qualquer momento, o acesso, a correção ou a exclusão dos meus dados.</div>` : '';
  const intro = secao.intro ? `<p class="note" style="margin:0 0 12px">${esc(secao.intro)}</p>` : '';
  return `<section class="card" id="${secao.id}">
    <div class="card-head">${esc(secao.titulo)}</div>
    <div class="card-body">${intro}${lgpdText}${camposHtml}</div>
  </section>`;
}

function progresso(){
  const visiveis = allFields.filter(fieldVisible);
  const total = visiveis.length || 1;
  const preenchidos = visiveis.filter(c => {
    const v = state[c.k];
    if(Array.isArray(v)) return v.length > 0;
    if(typeof v === 'object' && v) return Object.keys(v).length > 0;
    return v !== undefined && v !== '';
  }).length;
  return Math.min(100, Math.round((preenchidos/total)*100));
}

function tierLabel(){
  const t = getTier();
  if(t === 0) return '';
  if(t === 1) return 'Cadastro básico';
  if(t === 2) return 'Cadastro intermediário';
  return 'Cadastro completo';
}

function renderForm(){
  const app = document.getElementById('app');
  const secoesHtml = SECOES.map(renderSecao).join('');
  const tl = tierLabel();
  app.innerHTML = `
    <div class="topbar">
      <img src="${LOGO}" alt="Núcleo RH">
      <div class="brand-text"><b>NÚCLEO RH</b><span>Recrutamento e Seleção</span></div>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${progresso()}%"></div></div>
    <div class="wrap">
      <div class="hero">
        <h1>Cadastro — Banco de Talentos</h1>
        <p>Preencha com atenção. Os campos marcados com <span class="req">*</span> são obrigatórios. ${tl ? `Perguntas adicionais foram liberadas conforme sua escolaridade — <b>${esc(tl)}</b>.` : 'Após informar sua escolaridade, mostraremos as perguntas mais relevantes para o seu perfil.'}</p>
      </div>
      <div class="meta-row">
        <div class="field"><label>${esc(VAGA_FIELD.label)}</label><input type="text" value="${esc(state.vaga||'')}" oninput="state.vaga=this.value" placeholder="Ex: Garçom, Recepcionista, Assistente Administrativo"></div>
      </div>
      <div class="err-banner" id="err-banner"></div>
      ${secoesHtml}
      <div class="actions">
        <button class="btn" onclick="enviar()">Enviar formulário</button>
      </div>
    </div>
  `;
}

async function enviar(){
  const faltando = allFields.filter(c => c.req && fieldVisible(c)).filter(c => {
    const v = state[c.k];
    return v === undefined || v === '';
  });
  if(faltando.length){
    showErr('Preencha os campos obrigatórios: ' + faltando.map(f=>f.label).join(', '));
    return;
  }
  const btn = document.querySelector('.actions .btn');
  btn.disabled = true;
  btn.textContent = 'Enviando...';

  const id = uid();
  const payload = Object.assign({}, state, {
    _id: id,
    _tier: getTier(),
    _enviadoEm: new Date().toISOString()
  });

  try{
    await enviarPayload(id, payload);
    renderSucesso();
  }catch(e){
    btn.disabled = false;
    btn.textContent = 'Enviar formulário';
    showErr('Não foi possível enviar agora. Verifique sua conexão e tente novamente.');
  }
}

function renderSucesso(){
  document.getElementById('app').innerHTML = `
    <div class="success">
      <div class="check"><svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M4 12l5 5L20 6" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <h1>Formulário enviado com sucesso!</h1>
      <p>Obrigado por preencher seus dados com a Núcleo RH. Nossa equipe de recrutamento vai analisar suas informações e entrará em contato pelos canais autorizados.</p>
    </div>`;
}

/* ===================== PAINEL DO AVALIADOR ===================== */

function renderAdmin(candidatos){
  candidatos.sort((a,b) => (a._enviadoEm||'').localeCompare(b._enviadoEm||''));
  const rows = candidatos.map((c,i) => `
    <div class="cand-row">
      <div class="idx">${i+1}</div>
      <div class="info">
        <b>${esc(c.nome || '(sem nome)')}</b>
        <span>${esc(c.cargoPretendido || c.vaga || 'Vaga não informada')} · ${esc(c.whatsapp||c.telefone||'')} · ${c._enviadoEm ? new Date(c._enviadoEm).toLocaleString('pt-BR') : ''}</span>
      </div>
    </div>`).join('');

  document.getElementById('app').innerHTML = `
    <div class="admin-wrap">
      <div class="admin-topbar no-print">
        <img src="${LOGO}" width="34" height="34" style="border-radius:50%">
        <h1>Painel do avaliador — Núcleo RH</h1>
        <span class="count">${candidatos.length} candidato(s)</span>
      </div>
      <div class="admin-toolbar no-print">
        <button class="btn small" onclick="window.print()">Imprimir todos em lote</button>
        <button class="btn small secondary" onclick="location.hash='';location.reload()">Ver formulário de preenchimento</button>
        ${typeof auth !== 'undefined' ? '<button class="btn small secondary" onclick="auth.signOut()">Sair</button>' : ''}
      </div>
      <div class="candidate-list no-print">${rows || '<p class="note">Nenhum candidato preencheu o formulário ainda.</p>'}</div>
      <div id="print-area">${candidatos.map(printCandidato).join('')}</div>
    </div>
  `;
}

function respostaTexto(c, campo){
  const v = c[campo.k];
  if(v === undefined || v === null || v === '') return '—';
  if(Array.isArray(v)) return v.length ? v.join(', ') : '—';
  return String(v);
}

function printGridTable(c, campo){
  const linhas = campo.linhas.concat(campo.comOutro ? [(c[campo.k+'__outroLabel']? 'Outro: '+c[campo.k+'__outroLabel'] : 'Outro')] : []);
  const val = c[campo.k] || {};
  const linhasOriginais = campo.linhas.concat(campo.comOutro ? ['Outro'] : []);
  return `<table class="print-grid"><thead><tr><th></th>${campo.colunas.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead>
    <tbody>${linhasOriginais.map((linhaOrig, idx) => `<tr><td>${esc(linhas[idx])}</td>${campo.colunas.map(col => `<td>${val[linhaOrig]===col?'☑':'☐'}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}

function printScale5(c, campo){
  const val = c[campo.k] || {};
  return `<table class="print-grid"><thead><tr><th style="text-align:left">Competência</th>${[1,2,3,4,5].map(n=>`<th>${n}</th>`).join('')}</tr></thead>
    <tbody>${campo.linhas.map(linha => `<tr><td>${esc(linha)}</td>${[1,2,3,4,5].map(n=>`<td>${val[linha]===n?'☑':'☐'}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}

function printField(c, campo){
  if((campo.tier||0) > (c._tier===undefined?3:c._tier)) return '';
  if(campo.tipo === 'grid') return `<div class="p-field"><b>${esc(campo.label)}</b>${printGridTable(c,campo)}</div>`;
  if(campo.tipo === 'scale5') return `<div class="p-field"><b>${esc(campo.label)}</b>${printScale5(c,campo)}</div>`;
  const val = c[campo.k];
  if(val === undefined || val === '' || (Array.isArray(val) && val.length===0)) return '';
  return `<div class="p-field"><b>${esc(campo.label)}:</b> ${esc(respostaTexto(c,campo))}</div>`;
}

function printCandidato(c){
  const secoesHtml = SECOES.filter(s => (s.tier||0) <= (c._tier===undefined?3:c._tier)).map(s => {
    const body = s.campos.map(campo => printField(c, campo)).join('');
    if(!body.trim()) return '';
    return `<div class="p-section">
      <div class="p-section-head">${esc(s.titulo)}</div>
      <div class="p-section-body">${body}</div>
    </div>`;
  }).join('');

  const avaliadorHtml = `
    <div class="p-section">
      <div class="p-section-head">${esc(SECAO_AVALIADOR.titulo)}</div>
      <div class="p-section-body">
        <table class="print-grid"><thead><tr><th style="text-align:left">Critério observado</th>${SECAO_AVALIADOR.colunas.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead>
        <tbody>${SECAO_AVALIADOR.criterios.map(cr => `<tr><td>${esc(cr)}</td>${SECAO_AVALIADOR.colunas.map(()=>`<td>☐</td>`).join('')}</tr>`).join('')}</tbody></table>
        <div class="p-field" style="margin-top:10px"><b>Parecer final:</b> ${SECAO_AVALIADOR.pareceres.map(p=>'☐ '+p).join('&nbsp;&nbsp;&nbsp;')}</div>
        <div class="p-field"><b>Observações do avaliador:</b><div style="border-bottom:1px solid #ccc;height:40px"></div></div>
      </div>
    </div>`;

  const tierNomes = {1:'Básico', 2:'Intermediário', 3:'Completo'};

  return `<div class="print-page">
    <div class="p-header">
      <img src="${LOGO}" width="46" height="46">
      <div><b>NÚCLEO RH</b><span>Recrutamento e Seleção</span></div>
    </div>
    <h2 class="p-title">Cadastro — Banco de Talentos ${c._tier ? '(' + (tierNomes[c._tier]||'') + ')' : ''}</h2>
    <table class="p-meta"><tr>
      <td><b>ID do Candidato</b><br>${esc(c._id||'')}</td>
      <td><b>Data do Cadastro</b><br>${c._enviadoEm ? new Date(c._enviadoEm).toLocaleDateString('pt-BR') : '____/____/________'}</td>
      <td><b>Vaga / Processo</b><br>${esc(c.vaga||'—')}</td>
    </tr></table>
    <div class="p-avaliador-line">Atendimento: Núcleo RH — Recrutamento e Seleção</div>
    ${secoesHtml}
    ${avaliadorHtml}
    <div class="p-section">
      <div class="p-section-head">Autorização e consentimento — assinaturas</div>
      <div class="p-section-body" style="display:flex;gap:40px;margin-top:20px">
        <div style="flex:1;text-align:center">
          <div style="border-top:1px solid #333;padding-top:6px">Assinatura do Candidato<br>${esc(c.assinatura||'')}</div>
          <div style="font-size:11px;margin-top:4px">Data: ${c._enviadoEm ? new Date(c._enviadoEm).toLocaleDateString('pt-BR') : '____/____/________'}</div>
        </div>
        <div style="flex:1;text-align:center">
          <div style="border-top:1px solid #333;padding-top:6px">Assinatura do Avaliador</div>
          <div style="font-size:11px;margin-top:4px">Data: ____/____/________</div>
        </div>
      </div>
    </div>
    <div class="p-footer">Núcleo RH © 2026 | Documento confidencial — uso restrito ao processo seletivo</div>
  </div>`;
}

/* estilos de impressão injetados junto (mesma folha, sem CSS externo extra) */
const printStyle = document.createElement('style');
printStyle.textContent = `
  .print-page{
    background:#fff;color:#1c2530;max-width:800px;margin:0 auto 0;
    padding:28px 34px;font-family:Inter,Arial,sans-serif;font-size:12.5px;
    page-break-after:always;
  }
  .p-header{display:flex;align-items:center;gap:10px;border-bottom:2px solid #173d63;padding-bottom:10px}
  .p-header b{display:block;color:#173d63;font-size:15px}
  .p-header span{display:block;color:#51606f;font-size:10px}
  .p-title{text-align:center;color:#173d63;font-size:16px;margin:14px 0 12px}
  .p-meta{width:100%;border-collapse:collapse;margin-bottom:6px}
  .p-meta td{border:1px solid #d7dee6;padding:6px 10px;font-size:11px;width:33%}
  .p-avaliador-line{font-size:10.5px;color:#51606f;margin:4px 0 12px}
  .p-section{margin-top:10px}
  .p-section-head{background:#173d63;color:#fff;font-size:11.5px;font-weight:700;padding:5px 10px;text-transform:uppercase;letter-spacing:.03em}
  .p-section-body{padding:8px 2px}
  .p-field{margin-bottom:5px;line-height:1.4}
  table.print-grid{width:100%;border-collapse:collapse;margin:4px 0 8px;font-size:10.5px}
  table.print-grid th,table.print-grid td{border:1px solid #d7dee6;padding:3px 5px;text-align:center}
  table.print-grid th:first-child,table.print-grid td:first-child{text-align:left}
  .p-footer{margin-top:16px;text-align:center;font-size:9.5px;color:#8a97a3;border-top:1px solid #d7dee6;padding-top:8px}
  @media screen{ .print-page{border:1px solid #d7dee6;border-radius:8px;margin:0 auto 24px;box-shadow:0 1px 4px rgba(0,0,0,.06)} }
  @media print{ .print-page{box-shadow:none;border:none;margin:0} }
`;
document.head.appendChild(printStyle);


/* ===================== ENVIO (Firestore) ===================== */
async function enviarPayload(id, payload){
  await firestore.collection('submissions').doc(id).set(payload);
}

/* ===================== LOGIN DO PAINEL ===================== */
function renderLogin(erro){
  document.getElementById('app').innerHTML = `
    <div class="login-box">
      <h1>Painel do avaliador</h1>
      <p>Faça login com sua conta de administrador da Núcleo RH.</p>
      ${erro ? `<div class="err-banner" style="display:block">${esc(erro)}</div>` : ''}
      <div class="field"><label>E-mail</label><input type="email" id="login-email" autocomplete="username"></div>
      <div class="field"><label>Senha</label><input type="password" id="login-senha" autocomplete="current-password"></div>
      <button class="btn" onclick="fazerLogin()">Entrar</button>
    </div>`;
  document.getElementById('login-senha').addEventListener('keydown', e => { if(e.key === 'Enter') fazerLogin(); });
}

window.fazerLogin = async function(){
  const email = document.getElementById('login-email').value.trim();
  const senha = document.getElementById('login-senha').value;
  try{
    await auth.signInWithEmailAndPassword(email, senha);
  }catch(e){
    renderLogin('E-mail ou senha inválidos.');
  }
};

async function renderAdminGate(){
  document.getElementById('app').innerHTML = `<div class="gate">Carregando painel do avaliador…</div>`;
  auth.onAuthStateChanged(async user => {
    if(location.hash !== '#admin') return;
    if(!user){
      renderLogin();
      return;
    }
    try{
      const snap = await firestore.collection('submissions').get();
      renderAdmin(snap.docs.map(d => d.data()));
    }catch(e){
      document.getElementById('app').innerHTML = `<div class="gate">Você não tem permissão de administrador para ver as respostas.<br><button class="btn small" style="margin-top:14px" onclick="auth.signOut()">Sair</button></div>`;
    }
  });
}


/* ===================== BOOT ===================== */

async function boot(){
  if(location.hash === '#admin'){
    await renderAdminGate();
    return;
  }
  renderForm();
}
boot();
window.addEventListener('hashchange', boot);
</script>
